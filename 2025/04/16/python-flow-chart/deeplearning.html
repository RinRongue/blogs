<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI学习流程 ver彩虹猫</title>
    <style>
        /* --- 全局与字体 --- */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        :root {
            --bg-color: #1a1a1d; --card-bg: #2c2c34; --text-color: #f0f0f0;
            --primary-color: #4a90e2; --line-color: #444; --accent-color: #e91e63;
            --indeterminate-color: #6c757d;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif; background-color: var(--bg-color);
            color: var(--text-color); padding: 40px; overflow-x: hidden;
            padding-bottom: 120px; /* 为底部导航栏留出空间 */
        }

        /* --- 彩虹猫雨 --- */
        #rain-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
        .nyan-cat-wrapper { position: absolute; }
        .nyan-cat-image { height: auto; opacity: 0.8; transform: rotate(45deg); }
        @keyframes diagonal-fall { from { transform: translate(0, 0); } to { transform: translate(110vw, 110vh); } }

        /* --- 页面内容 --- */
        .container {
            position: relative; z-index: 1; max-width: 900px; margin: 0 auto;
            background: rgba(44, 44, 52, 0.7); backdrop-filter: blur(10px);
            border-radius: 16px; padding: 20px 40px; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 20px; font-weight: 700; text-shadow: 0 0 10px var(--primary-color); }
        .info-box {
            background-color: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px; margin-bottom: 40px;
            text-align: center; font-size: 0.9em; line-height: 1.7; border: 1px solid var(--line-color);
        }
        .info-box p { margin: 8px 0; color: #ccc; }
        .info-box a { color: var(--accent-color); text-decoration: none; font-weight: bold;}
        .rainbow-text {
            font-size: 3em; font-weight: 700; margin: 15px 0;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            background-size: 400% 100%; -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; animation: rainbow-flow 4s linear infinite;
        }
        @keyframes rainbow-flow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

        /* --- 流程图切换逻辑 --- */
        .flowchart-content {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }
        .flowchart-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- 脑图样式 (通用) --- */
        .mindmap, .mindmap ul { list-style-type: none; padding-left: 30px; position: relative; }
        .mindmap li { position: relative; padding: 5px 0 5px 45px; }
        .mindmap li::before, .mindmap li::after { content: ''; position: absolute; left: 0; border-color: var(--line-color); }
        .mindmap li::before { border-left: 2px solid var(--line-color); height: 100%; top: 0; width: 20px; }
        .mindmap li:last-child::before { height: 22px; }
        .mindmap li::after { border-top: 2px solid var(--line-color); top: 22px; width: 25px; }
        .item-content {
            background-color: var(--card-bg); border-radius: 8px; padding: 10px 15px;
            display: inline-flex; align-items: center; border: 1px solid var(--line-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); transition: all 0.3s ease; cursor: pointer;
        }
        .item-content:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 25px rgba(74, 144, 226, 0.3); border-color: var(--primary-color); }

        /* --- 自定义复选框 (通用) --- */
        .item-content label { cursor: pointer; display: flex; align-items: center; }
        input[type="checkbox"] { display: none; }
        .custom-checkbox {
            width: 20px; height: 20px; background-color: #333; border: 2px solid var(--line-color);
            border-radius: 5px; margin-right: 15px; transition: all 0.3s ease;
            position: relative; flex-shrink: 0;
        }
        .custom-checkbox::after { color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); transition: all 0.2s ease-out; }
        input[type="checkbox"]:checked + label .custom-checkbox { background-color: var(--primary-color); border-color: var(--primary-color); box-shadow: 0 0 10px var(--primary-color); }
        input[type="checkbox"]:checked + label .custom-checkbox::after { content: '✔'; font-size: 16px; transform: translate(-50%, -50%) scale(1); }
        input[type="checkbox"]:indeterminate + label .custom-checkbox { background-color: var(--indeterminate-color); border-color: var(--indeterminate-color); }
        input[type="checkbox"]:indeterminate + label .custom-checkbox::after { content: '—'; font-size: 20px; line-height: 20px; transform: translate(-50%, -50%) scale(1); }
        .details { font-size: 0.8em; color: #aaa; margin-left: 8px; font-style: italic; }

        /* --- 底部导航栏 --- */
        .navigation-box {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(26, 26, 29, 0.8); backdrop-filter: blur(10px);
            display: flex; justify-content: center; padding: 15px 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3); z-index: 1000;
        }
        .nav-button {
            font-family: 'Noto Sans SC', sans-serif; font-size: 1em;
            font-weight: 500; color: #aaa; background: transparent;
            border: 2px solid transparent; border-radius: 8px;
            padding: 10px 25px; margin: 0 10px; cursor: pointer;
            transition: all 0.3s ease;
        }
        .nav-button:hover { color: white; background-color: rgba(255,255,255,0.1); }
        .nav-button.active {
            color: var(--primary-color); border-color: var(--primary-color);
            background-color: rgba(74, 144, 226, 0.1);
            text-shadow: 0 0 5px var(--primary-color);
        }
    </style>
</head>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // --- 元素获取 ---
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        const navBox = document.querySelector('.navigation-box');
        const mainTitle = document.getElementById('main-title');
        
        // --- 进度保存/加载逻辑 ---
        const storageKeyPrefix = 'ai_universe_progress_';
        let userId = localStorage.getItem('ai_universe_userId');
        if (!userId) {
            userId = 'user-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('ai_universe_userId', userId);
        }
        const userProgressKey = storageKeyPrefix + userId;

        function saveProgress() {
            const progress = {};
            checkboxes.forEach(cb => {
                if (cb.checked) progress[cb.id] = 'checked';
                else if (cb.indeterminate) progress[cb.id] = 'indeterminate';
            });
            localStorage.setItem(userProgressKey, JSON.stringify(progress));
        }

        function loadProgress() {
            const progress = JSON.parse(localStorage.getItem(userProgressKey) || '{}');
            checkboxes.forEach(cb => {
                if (progress[cb.id] === 'checked') cb.checked = true;
                else if (progress[cb.id] === 'indeterminate') cb.indeterminate = true;
            });
        }
        
        // --- 智能复选框逻辑 ---
        function handleCheckboxChange(e) {
            const current = e.target;
            const parentLi = current.closest('li');
            parentLi.querySelectorAll('ul input[type="checkbox"]').forEach(child => {
                child.checked = current.checked;
                child.indeterminate = false;
            });
            updateParentState(current);
            saveProgress();
        }
        
        function updateParentState(checkbox) {
            const parentLi = checkbox.closest('ul')?.closest('li');
            if (!parentLi) return;
            const parentCheckbox = parentLi.querySelector('input[type="checkbox"]');
            const siblings = Array.from(parentLi.querySelectorAll('ul > li > .item-content > input[type="checkbox"]'));
            const allChecked = siblings.every(s => s.checked);
            const noneChecked = siblings.every(s => !s.checked && !s.indeterminate);
            if (allChecked) {
                parentCheckbox.checked = true;
                parentCheckbox.indeterminate = false;
            } else if (noneChecked) {
                parentCheckbox.checked = false;
                parentCheckbox.indeterminate = false;
            } else {
                parentCheckbox.indeterminate = true;
                parentCheckbox.checked = false;
            }
            updateParentState(parentCheckbox);
        }
        
        // --- 导航栏切换逻辑 ---
        navBox.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') return;
            const button = e.target;
            const targetId = button.dataset.target;
            const targetTitle = button.dataset.title;

            document.querySelector('.nav-button.active').classList.remove('active');
            button.classList.add('active');

            document.querySelector('.flowchart-content.active').classList.remove('active');
            document.getElementById(targetId).classList.add('active');
            
            mainTitle.textContent = targetTitle;
            mainTitle.style.animation = 'none';
            setTimeout(() => mainTitle.style.animation = '', 0); // 重启动画
        });

        // --- 初始化 ---
        checkboxes.forEach(cb => cb.addEventListener('change', handleCheckboxChange));
        loadProgress();
        document.querySelectorAll('.flowchart-content').forEach(flowchart => {
            flowchart.querySelectorAll('input[type="checkbox"]').forEach(updateParentState);
        });

        // --- 彩虹猫雨逻辑 ---
        const rainContainer = document.getElementById('rain-container');
        const catImageUrl = 'https://media.tenor.com/OSvXx8hEwgcAAAAi/nyan-cat-cat.gif';
        function createCat() {
            const wrapper = document.createElement('div');
            wrapper.className = 'nyan-cat-wrapper';
            const cat = document.createElement('img');
            cat.src = catImageUrl;
            cat.className = 'nyan-cat-image';
            const randomSize = 60 + Math.random() * 80;
            cat.style.width = `${randomSize}px`;
            wrapper.appendChild(cat);
            if (Math.random() > 0.4) {
                wrapper.style.top = '-200px';
                wrapper.style.left = (Math.random() * (window.innerWidth + 400) - 400) + 'px';
            } else {
                wrapper.style.top = (Math.random() * (window.innerHeight + 400) - 400) + 'px';
                wrapper.style.left = '-200px';
            }
            const randomDelay = Math.random() * 7;
            const randomDuration = 4 + Math.random() * 5;
            wrapper.style.animation = `diagonal-fall ${randomDuration}s linear ${randomDelay}s forwards`;
            rainContainer.appendChild(wrapper);
            setTimeout(() => { wrapper.remove(); }, (randomDelay + randomDuration + 1) * 1000);
        }
        setInterval(createCat, 200);
    });
    </script>
</body>
</html>
